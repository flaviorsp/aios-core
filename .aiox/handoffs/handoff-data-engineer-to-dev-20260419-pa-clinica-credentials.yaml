handoff:
  from_agent: aiox-data-engineer
  to_agent: aiox-dev
  timestamp: "2026-04-19T00:00:00Z"
  team: 6b
  consumed: false

  request_type: schema_delivery
  priority: HIGH
  blocking: false
  unblocks: "Story 5.1 body scaffold (Team 7) — clinic login + password reset"

  context: |
    Team 6b (aiox-data-engineer) delivered the pa_clinica_credentials schema
    for Story 5.1 (Post-Conversion Edit Flow). ARCH-DECISION TD-AUDIT-W4-03 fully
    implemented per contract frozen in 5.1.story.md lines 55-62.

    Design decisions (autonomous):
    - UUID primary key (consistent with all pa_* tables)
    - citext for email (case-insensitive unique without LOWER() in queries)
    - has_secure_password (bcrypt) — first use of this Rails pattern in PA codebase
    - FK pa_clinicas ON DELETE CASCADE + UNIQUE on pa_clinica_id (1:1 enforced)
    - Partial indexes on reset_token + locked_until (performance — most NULL)
    - Lock threshold: 5 failed attempts -> 30min lock (LOCK_THRESHOLD constant)
    - Reset token TTL: 1h (matches 5.1 AC)

  schema_delivered:
    table: pa_clinica_credentials
    migration_file: "pa/backend/portalamparo-chatwoot/db/migrate/20260419000001_create_pa_clinica_credentials.rb"
    schema_summary:
      - "id UUID PK"
      - "pa_clinica_id UUID NOT NULL, UNIQUE, FK pa_clinicas(id) ON DELETE CASCADE"
      - "email CITEXT NOT NULL, UNIQUE"
      - "password_digest VARCHAR(255) NOT NULL (bcrypt)"
      - "reset_token VARCHAR(255), UNIQUE WHERE NOT NULL"
      - "reset_token_expires_at TIMESTAMPTZ"
      - "last_login_at TIMESTAMPTZ"
      - "failed_login_count INTEGER NOT NULL DEFAULT 0"
      - "locked_until TIMESTAMPTZ"
      - "created_at, updated_at TIMESTAMPTZ"
    indexes:
      - "idx_pa_clinica_credentials_clinica_unique (pa_clinica_id) UNIQUE"
      - "idx_pa_clinica_credentials_email_unique (email) UNIQUE"
      - "idx_pa_clinica_credentials_reset_token (reset_token) UNIQUE WHERE reset_token IS NOT NULL"
      - "idx_pa_clinica_credentials_locked_until (locked_until) WHERE locked_until IS NOT NULL"
    extensions_required:
      - "citext (enabled in migration if not present)"

  model_delivered:
    file: "pa/backend/portalamparo-chatwoot/app/models/pa_clinica_credential.rb"
    class_name: "PaClinicaCredential"
    table_name: "pa_clinica_credentials"
    key_features:
      - "has_secure_password (bcrypt)"
      - "belongs_to :pa_clinica (inverse_of: :credential)"
      - "Email validation: presence, uniqueness (case-insensitive), URI::MailTo::EMAIL_REGEXP format"
      - "Password validation: min 8 chars (only when password present — allows partial updates)"
      - "Scopes: .locked, .unlocked, .with_active_reset_token"
      - "Methods: locked?, register_failed_login!, register_successful_login!(ip:), generate_reset_token!, reset_token_valid?, clear_reset_token!"
      - "Constants: LOCK_THRESHOLD=5, LOCK_DURATION=30.minutes, RESET_TOKEN_TTL=1.hour"

  integration_points:
    pa_clinica_model:
      file: "pa/backend/portalamparo-chatwoot/app/models/pa_clinica.rb"
      action_required: "Add `has_one :credential, class_name: 'PaClinicaCredential', foreign_key: 'pa_clinica_id', dependent: :destroy, inverse_of: :pa_clinica`"
    clinic_auth_controller:
      file: "pa/backend/portalamparo-chatwoot/app/controllers/api/v1/public/pa/clinic_auth_controller.rb"
      action_required: "Create — use PaClinicaCredential.find_by(email:) + authenticate (bcrypt). On success call register_successful_login!; on fail register_failed_login!."
    clinic_password_resets_controller:
      file: "pa/backend/portalamparo-chatwoot/app/controllers/api/v1/public/pa/clinic_password_resets_controller.rb"
      action_required: "Create — POST create: generate_reset_token! + send mailer. POST update: validate reset_token_valid? + update password + clear_reset_token!"
    parceiros_clinic_auth:
      file: "pa/apps/portalamparo-parceiros/src/lib/clinic-auth.ts"
      action_required: "Create — HTTP client that calls Rails POST /public/pa/clinic-auth/login; stores role='clinic' in sealed iron-session cookie"

  test_data_suggestion:
    factory_bot:
      file: "spec/factories/pa_clinica_credentials.rb"
      template: |
        FactoryBot.define do
          factory :pa_clinica_credential, class: 'PaClinicaCredential' do
            pa_clinica
            sequence(:email) { |n| "clinic#{n}@example.com" }
            password { 'SecurePass123!' }
            password_confirmation { 'SecurePass123!' }

            trait :locked do
              failed_login_count { 5 }
              locked_until { 30.minutes.from_now }
            end

            trait :with_reset_token do
              reset_token { SecureRandom.urlsafe_base64(32) }
              reset_token_expires_at { 1.hour.from_now }
            end
          end
        end
    seed_suggestion: |
      # db/seeds/pa_clinica_credentials_dev.rb (dev/test only)
      Pa::Clinica.limit(5).each do |clinica|
        next if clinica.credential.present?
        PaClinicaCredential.create!(
          pa_clinica: clinica,
          email: "clinic-#{clinica.id[0..7]}@example.com",
          password: 'DevPass2026!',
          password_confirmation: 'DevPass2026!'
        )
      end

  test_coverage_required:
    model_specs:
      - "validates email uniqueness (case-insensitive via citext)"
      - "validates pa_clinica_id uniqueness (1:1 enforcement)"
      - "has_secure_password authentication (password matches / fails)"
      - "register_failed_login! increments counter"
      - "register_failed_login! locks account after LOCK_THRESHOLD (5) attempts"
      - "register_successful_login! resets counter + clears lock"
      - "generate_reset_token! sets token + expiry"
      - "reset_token_valid? returns false after TTL expires"
      - "clear_reset_token! nullifies both token + expiry"
    request_specs:
      - "POST clinic-auth/login with valid creds returns 200 + sealed cookie"
      - "POST clinic-auth/login with invalid creds returns 401 + increments failed_login_count"
      - "POST clinic-auth/login on locked account returns 423 (Locked)"
      - "POST clinic-auth/login is rate-limited by rack_attack (TD-W2-04 integration)"

  migration_test:
    status: "NOT_YET_RUN"
    reason: "Migration file delivered; Rails app requires Docker to run — @dev should run during Story 5.1 implementation"
    commands: |
      cd pa/backend/portalamparo-chatwoot
      docker compose exec rails bundle exec rails db:migrate
      # Verify:
      docker compose exec rails bundle exec rails runner "puts PaClinicaCredential.column_names"
      # Test rollback:
      docker compose exec rails bundle exec rails db:rollback STEP=1
      docker compose exec rails bundle exec rails db:migrate
    rollback_safety: "YES — `change` block is fully reversible (create_table + add_index + add_foreign_key all invertible). citext extension enable is idempotent."

  references:
