handoff:
  from_agent: aiox-sm
  to_agent: aiox-data-engineer
  timestamp: "2026-04-19T00:00:00Z"
  team: 5
  consumed: false

  request_type: schema_review
  priority: HIGH
  blocking: true
  blocks: "Story 5.1 body scaffold — clinic login migration (Wave-4a Week 1 Day 4-5)"

  context: |
    ARCH-DECISION TD-AUDIT-W4-03 (resolved 2026-04-19 by Team 3):
    Story 5.1 (Post-Conversion Edit Flow) requires a NEW authentication table for clinics
    logging into the Parceiros portal. This is separate from Story 0.10 Chatwoot staff auth.

    Decision summary:
    - Separate pa_clinica_credentials table (clinics are NOT Chatwoot users)
    - Role-discriminated iron-session cookies:
        staff: pa_parceiros_session (existing, from Story 0.10)
        clinic: pa_clinic_session (new, Story 5.1)
    - SealedSessionPayload has role: 'staff' | 'clinic' discriminator (TD-W2-02 session.ts)
    - iron-session sealing shared between staff and clinic sessions

    The session.ts contract is already frozen at:
    pa/apps/portalamparo-parceiros/src/lib/session.ts
    (sealSession/unsealSession with role discriminator + dual-read legacy fallback)

    What is needed from @data-engineer:
    1. DDL design for pa_clinica_credentials table
    2. Rails migration file
    3. Review of field types, indexes, and FK strategy

  artifact_expected:
    type: "DDL + Rails migration"
    table_name: pa_clinica_credentials
    suggested_fields:
      - "id: bigint primary key"
      - "clinica_id: bigint NOT NULL — FK to pa_clinicas.id (ON DELETE CASCADE)"
      - "email: varchar(255) NOT NULL — login identifier"
      - "password_digest: varchar(255) NOT NULL — bcrypt digest (has_secure_password)"
      - "role: varchar(50) NOT NULL DEFAULT 'clinic' — discriminator for SealedSessionPayload"
      - "session_token: varchar(255) — optional revocable token per session"
      - "last_login_at: timestamp"
      - "login_attempts: integer DEFAULT 0 — brute-force counter"
      - "locked_until: timestamp — null means not locked"
      - "created_at: timestamp NOT NULL"
      - "updated_at: timestamp NOT NULL"
    suggested_indexes:
      - "UNIQUE INDEX on email (login identifier)"
      - "INDEX on clinica_id (FK lookup)"
    notes: |
      @data-engineer decides final schema — the field list above is a suggestion from ARCH-DECISION,
      not a mandatory spec. Add/remove fields as appropriate.
      Consider: should one clinica have multiple credentials (staff users)? If yes, add name/role column.
      Consider: password reset token + expiry fields (needed for Story 5.1 AC: magic link or reset flow).
    delivery_path: "pa/backend/portalamparo-chatwoot/db/migrate/YYYYMMDDNNNNNN_create_pa_clinica_credentials.rb"

